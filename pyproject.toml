[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facktyper"
version = "1.0.0"
description = "FakeTyper Pro —— 伪装打字桌面软件（录制教学视频时把预设代码假装手敲输出）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FakeTyper Pro" }]
dependencies = [
    "PySide6>=6.6.0",
    "keyboard>=0.13.5",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
facktyper = "facktyper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facktyper = ["resources/**/*"]
